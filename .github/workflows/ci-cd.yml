name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black
      
      - name: Run Flake8 linter
        run: |
          flake8 automotive_doc_intelligence --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 automotive_doc_intelligence --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Check code formatting with Black
        run: |
          black --check automotive_doc_intelligence || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Create virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r automotive_doc_intelligence/requirements.txt
      
      - name: Create .env file for testing
        run: |
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" > automotive_doc_intelligence/.env
          echo "ENVIRONMENT=test" >> automotive_doc_intelligence/.env
          echo "CHROMA_PERSIST_DIR=./test_chroma_db" >> automotive_doc_intelligence/.env
      
      - name: Run pytest
        run: |
          source venv/bin/activate
          cd automotive_doc_intelligence
          pytest tests/ -v --tb=short || echo "No tests found or tests failed"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        run: |
          docker build -t automotive-doc-intel:${{ github.sha }} automotive_doc_intelligence/
      
      - name: Run container health check
        run: |
          docker run -d --name test-container -e GOOGLE_API_KEY=test automotive-doc-intel:${{ github.sha }}
          sleep 10
          docker logs test-container
          docker stop test-container
          docker rm test-container

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Run security scan with pip-audit
        uses: pypa/pip-audit@main
        with:
          inputs: automotive_doc_intelligence/requirements.txt

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Deploy to staging (example)
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment commands here
          # e.g., kubectl apply, docker push, etc.

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Deploy to production (example)
        run: |
          echo "Deploying to production environment..."
          # Add your deployment commands here
          # e.g., kubectl apply, docker push, etc.

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, build, deploy-staging, deploy-production]
    if: failure()
    
    steps:
      - name: Send failure notification
        run: |
          echo "Pipeline failed - notification would be sent here"
          # Add notification logic (Slack, Email, etc.)